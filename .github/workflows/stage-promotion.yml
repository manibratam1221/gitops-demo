name: Production Release Promotion

on:
  push:
    branches:
      - main
    paths:
      - "stage/**"

jobs:

  promote:

    runs-on: self-hosted

    concurrency:
      group: production-promotion
      cancel-in-progress: false

    environment:
      name: production

    env:
      PROJECT: gitops-demo
      STAGE: stage
      KARGO_VERSION: "1.11.2"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Verify Kubernetes / Kargo connectivity
      # ============================================================

      - name: Verify Cluster Connectivity
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Cluster Connectivity"
          echo "=============================================="

          echo "Kubectl:"
          kubectl version --client

          echo ""
          echo "Kubernetes Nodes:"
          kubectl get nodes

          echo ""
          echo "Kargo Stage:"
          kubectl get stages \
            -n "${PROJECT}"

          echo ""
          echo "Available Freight:"
          kubectl get freight \
            -n "${PROJECT}"

          echo ""
          echo "Connectivity verification successful."


      # ============================================================
      # 3. Install EXACT Kargo CLI version
      # ============================================================

      - name: Install Kargo CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Kargo CLI Installation"
          echo "=============================================="

          echo "Required Kargo version: ${KARGO_VERSION}"

          OS="$(uname -s)"
          ARCH="$(uname -m)"

          echo "Runner OS        : ${OS}"
          echo "Runner ARCH      : ${ARCH}"

          # --------------------------------------------------------
          # Detect OS
          # --------------------------------------------------------

          case "${OS}" in
            Darwin)
              KARGO_OS="darwin"
              ;;
            Linux)
              KARGO_OS="linux"
              ;;
            *)
              echo "ERROR: Unsupported operating system: ${OS}"
              exit 1
              ;;
          esac

          # --------------------------------------------------------
          # Detect architecture
          # --------------------------------------------------------

          case "${ARCH}" in
            arm64|aarch64)
              KARGO_ARCH="arm64"
              ;;
            x86_64|amd64)
              KARGO_ARCH="amd64"
              ;;
            *)
              echo "ERROR: Unsupported architecture: ${ARCH}"
              exit 1
              ;;
          esac

          echo "Kargo OS         : ${KARGO_OS}"
          echo "Kargo ARCH       : ${KARGO_ARCH}"

          # --------------------------------------------------------
          # Install into runner-local bin
          #
          # Do NOT depend on whatever version is already installed
          # on the self-hosted runner.
          # --------------------------------------------------------

          KARGO_BIN_DIR="${HOME}/bin"

          mkdir -p "${KARGO_BIN_DIR}"

          echo "${KARGO_BIN_DIR}" >> "${GITHUB_PATH}"

          KARGO_URL="https://github.com/akuity/kargo/releases/download/v${KARGO_VERSION}/kargo-${KARGO_OS}-${KARGO_ARCH}"

          echo "Kargo download URL:"
          echo "${KARGO_URL}"

          TEMP_KARGO="$(mktemp)"

          echo ""
          echo "Downloading Kargo CLI..."

          curl \
            --fail \
            --show-error \
            --location \
            "${KARGO_URL}" \
            --output "${TEMP_KARGO}"

          chmod +x "${TEMP_KARGO}"

          mv "${TEMP_KARGO}" "${KARGO_BIN_DIR}/kargo"

          echo ""
          echo "Installed binary:"
          ls -lh "${KARGO_BIN_DIR}/kargo"

          echo ""
          echo "Kargo CLI version:"
          "${KARGO_BIN_DIR}/kargo" version

          # --------------------------------------------------------
          # Verify exact version
          # --------------------------------------------------------

          ACTUAL_VERSION="$(
            "${KARGO_BIN_DIR}/kargo" version \
              | awk '/Client Version:/ {print $3}'
          )"

          echo ""
          echo "Expected version : ${KARGO_VERSION}"
          echo "Actual version   : ${ACTUAL_VERSION}"

          if [[ "${ACTUAL_VERSION}" != "${KARGO_VERSION}" ]]; then
            echo ""
            echo "ERROR: Kargo CLI version mismatch."
            echo "Expected: ${KARGO_VERSION}"
            echo "Actual  : ${ACTUAL_VERSION}"
            exit 1
          fi

          echo ""
          echo "Kargo CLI version verified successfully."


      # ============================================================
      # 4. Login to Kargo
      # ============================================================

      - name: Login to Kargo
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Kargo Login"
          echo "=============================================="

          echo "Kargo CLI:"
          kargo version

          echo ""
          echo "Logging into Kargo..."

          kargo login \
            "${{ secrets.KARGO_SERVER }}" \
            --kubeconfig \
            --insecure-skip-tls-verify

          echo ""
          echo "Kargo login completed."

          echo ""
          echo "Kargo login and discovery successful."


      # ============================================================
      # 5. Capture Git commit
      # ============================================================

      - name: Save Commit SHA
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_SHA="${GITHUB_SHA}"

          echo "COMMIT_SHA=${COMMIT_SHA}" >> "${GITHUB_ENV}"

          echo "=============================================="
          echo "Release Commit"
          echo "=============================================="
          echo "Commit SHA: ${COMMIT_SHA}"


      # ============================================================
      # 6. Generate stable release identity
      # ============================================================

      - name: Generate Release Identity
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="release-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"

          echo "RELEASE_ID=${RELEASE_ID}" >> "${GITHUB_ENV}"

          echo "=============================================="
          echo "Release Identity"
          echo "=============================================="
          echo "Release ID: ${RELEASE_ID}"


      # ============================================================
      # 7. Wait for Freight matching this Git SHA
      # ============================================================

      - name: Wait for Matching Freight
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Waiting for Kargo Freight"
          echo "=============================================="

          echo "Project : ${PROJECT}"
          echo "Stage   : ${STAGE}"
          echo "Git SHA : ${COMMIT_SHA}"

          ATTEMPTS=30

          while [[ "${ATTEMPTS}" -gt 0 ]]; do

            FREIGHT="$(
              kubectl get freight \
                -n "${PROJECT}" \
                -o json \
              | jq -r \
                --arg SHA "${COMMIT_SHA}" '
                  .items[]
                  | select(
                      any(.commits[]?; .id == $SHA)
                    )
                  | .metadata.name
                ' \
              | head -n1
            )"

            if [[ -n "${FREIGHT}" ]]; then

              echo ""
              echo "Matching Freight found:"
              echo "${FREIGHT}"

              echo "FREIGHT_NAME=${FREIGHT}" >> "${GITHUB_ENV}"

              exit 0
            fi

            echo "No matching Freight yet."
            echo "Attempts remaining: ${ATTEMPTS}"

            ATTEMPTS=$((ATTEMPTS - 1))

            sleep 10

          done

          echo ""
          echo "ERROR: Timed out waiting for Freight."
          echo "Commit: ${COMMIT_SHA}"

          echo ""
          echo "Recent Freight:"
          kubectl get freight \
            -n "${PROJECT}" \
            -o wide

          exit 1


      # ============================================================
      # 8. Display release identity
      # ============================================================

      - name: Display Release Information
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "              PRODUCTION RELEASE"
          echo "=============================================="
          echo "Release ID : ${RELEASE_ID}"
          echo "Git SHA    : ${COMMIT_SHA}"
          echo "Freight    : ${FREIGHT_NAME}"
          echo "Project    : ${PROJECT}"
          echo "Stage      : ${STAGE}"
          echo "=============================================="
          echo ""


      # ============================================================
      # 9. Promote Freight
      # ============================================================

      - name: Promote Freight
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Kargo Promotion"
          echo "=============================================="

          echo "Project : ${PROJECT}"
          echo "Stage   : ${STAGE}"
          echo "Freight : ${FREIGHT_NAME}"

          kargo promote \
            --project "${PROJECT}" \
            --stage "${STAGE}" \
            --freight "${FREIGHT_NAME}" \
            --insecure-skip-tls-verify

          echo ""
          echo "Promotion request submitted."


      # ============================================================
      # 10. Wait for Promotion
      # ============================================================

      - name: Wait for Promotion
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Waiting for Kargo Promotion"
          echo "=============================================="

          PROMOTION=""

          for i in {1..30}; do

            PROMOTION="$(
              kubectl get promotions \
                -n "${PROJECT}" \
                -o json \
              | jq -r \
                --arg F "${FREIGHT_NAME}" '
                  .items
                  | map(
                      select(.spec.freight == $F)
                    )
                  | sort_by(.metadata.creationTimestamp)
                  | last
                  | .metadata.name
                '
            )"

            if [[ -n "${PROMOTION}" && "${PROMOTION}" != "null" ]]; then

              echo "Promotion found:"
              echo "${PROMOTION}"

              break
            fi

            echo "Promotion not created yet."
            echo "Attempt: ${i}/30"

            sleep 2

          done

          if [[ -z "${PROMOTION}" || "${PROMOTION}" == "null" ]]; then

            echo ""
            echo "ERROR: Promotion was not created."

            kubectl get promotions \
              -n "${PROJECT}" \
              -o wide

            exit 1
          fi

          echo ""
          echo "Waiting for Promotion to succeed..."

          kubectl wait \
            "promotion/${PROMOTION}" \
            -n "${PROJECT}" \
            --for=jsonpath='{.status.phase}'=Succeeded \
            --timeout=300s

          echo ""
          echo "Promotion succeeded."

          echo ""
          echo "Promotion details:"

          kubectl get promotion \
            "${PROMOTION}" \
            -n "${PROJECT}" \
            -o wide


      # ============================================================
      # 11. Verify Argo CD
      # ============================================================

      - name: Verify ArgoCD
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Argo CD Verification"
          echo "=============================================="

          echo "Waiting for Argo CD application to become Healthy..."

          kubectl wait \
            application/prod-app \
            -n argocd \
            --for=jsonpath='{.status.health.status}'=Healthy \
            --timeout=300s

          SYNC_STATUS="$(
            kubectl get application prod-app \
              -n argocd \
              -o jsonpath='{.status.sync.status}'
          )"

          HEALTH_STATUS="$(
            kubectl get application prod-app \
              -n argocd \
              -o jsonpath='{.status.health.status}'
          )"

          echo ""
          echo "Argo CD Application : prod-app"
          echo "Health Status       : ${HEALTH_STATUS}"
          echo "Sync Status         : ${SYNC_STATUS}"

          if [[ "${SYNC_STATUS}" != "Synced" ]]; then

            echo ""
            echo "ERROR: Application is not Synced."

            kubectl get application prod-app \
              -n argocd \
              -o yaml

            exit 1
          fi

          if [[ "${HEALTH_STATUS}" != "Healthy" ]]; then

            echo ""
            echo "ERROR: Application is not Healthy."

            kubectl get application prod-app \
              -n argocd \
              -o yaml

            exit 1
          fi

          echo ""
          echo "Argo CD application is Healthy and Synced."


      # ============================================================
      # 12. Release Summary
      # ============================================================

      - name: Release Summary
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "================================================"
          echo "        PRODUCTION RELEASE SUCCESSFUL"
          echo "================================================"
          echo ""
          echo "Release ID : ${RELEASE_ID}"
          echo "Git SHA    : ${COMMIT_SHA}"
          echo "Freight    : ${FREIGHT_NAME}"
          echo "Project    : ${PROJECT}"
          echo "Stage      : ${STAGE}"
          echo "Argo App   : prod-app"
          echo "Argo Sync  : Synced"
          echo "Argo Health: Healthy"
          echo "Status     : SUCCESS"
          echo ""
          echo "================================================"
          echo ""


      # ============================================================
      # 13. Failure Summary
      # ============================================================

      - name: Release Failure Summary
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "          PRODUCTION RELEASE FAILED"
          echo "================================================"
          echo ""

          echo "Release ID : ${RELEASE_ID:-not-created}"
          echo "Git SHA    : ${COMMIT_SHA:-not-created}"
          echo "Freight    : ${FREIGHT_NAME:-not-found}"
          echo "Project    : ${PROJECT}"
          echo "Stage      : ${STAGE}"

          echo ""
          echo "Kargo Stage:"
          kubectl get stage \
            "${STAGE}" \
            -n "${PROJECT}" \
            -o wide \
            2>/dev/null || true

          echo ""
          echo "Recent Promotions:"
          kubectl get promotions \
            -n "${PROJECT}" \
            -o wide \
            2>/dev/null || true

          echo ""
          echo "Argo CD Application:"
          kubectl get application prod-app \
            -n argocd \
            -o wide \
            2>/dev/null || true

          echo ""
          echo "================================================"
