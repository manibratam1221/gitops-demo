name: Production Release Promotion

on:
  push:
    branches:
      - main
    paths:
      - "stage/**"

jobs:
  promote:

    runs-on: self-hosted

    concurrency:
      group: production-promotion
      cancel-in-progress: false

    environment:
      name: production

    env:
      PROJECT: gitops-demo
      STAGE: stage
      KARGO_VERSION: "1.11.2"

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Verify Kubernetes connectivity
      # ------------------------------------------------------------

      - name: Verify Cluster Connectivity
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Cluster Connectivity"
          echo "=============================================="

          kubectl version --client
          kubectl get nodes

          echo ""
          echo "Kargo Stages:"
          kubectl get stages \
            -n "${PROJECT}"

          echo ""
          echo "Kargo Freight:"
          kubectl get freight \
            -n "${PROJECT}"

          echo ""
          echo "=============================================="

      # ------------------------------------------------------------
      # 3. Install / verify Kargo CLI
      # ------------------------------------------------------------

      - name: Install Kargo CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Kargo CLI ${KARGO_VERSION}"

          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"

          case "${ARCH}" in
            x86_64)
              ARCH="amd64"
              ;;
            aarch64|arm64)
              ARCH="arm64"
              ;;
            *)
              echo "Unsupported architecture: ${ARCH}"
              exit 1
              ;;
          esac

          case "${OS}" in
            linux)
              OS="linux"
              ;;
            darwin)
              OS="darwin"
              ;;
            *)
              echo "Unsupported operating system: ${OS}"
              exit 1
              ;;
          esac

          KARGO_URL="https://github.com/akuity/kargo/releases/download/v${KARGO_VERSION}/kargo-${OS}-${ARCH}"

          echo "Downloading:"
          echo "${KARGO_URL}"

          curl -fL \
            "${KARGO_URL}" \
            -o /tmp/kargo

          chmod +x /tmp/kargo

          sudo mv /tmp/kargo /usr/local/bin/kargo

          echo ""
          echo "Kargo CLI version:"
          kargo version

      # ------------------------------------------------------------
      # 4. Login to Kargo
      # ------------------------------------------------------------
      - name: Login to Kargo
        run: |
         set -euo pipefail
         echo "Kargo CLI:"
         kargo version

         echo "Logging into Kargo..."
         kargo login \
          "${{ secrets.KARGO_SERVER }}" \
          --kubeconfig \
          --insecure-skip-tls-verify

         echo "Kargo authentication successful"

         echo "Available projects:"
         kargo get projects

         echo "Stages in ${PROJECT}:"
         kargo get stages --project "${PROJECT}"

      # ------------------------------------------------------------
      # 5. Save commit SHA
      # ------------------------------------------------------------

      - name: Save Commit SHA
        shell: bash
        run: |
          set -euo pipefail

          echo "COMMIT_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

          echo "Commit SHA:"
          echo "${GITHUB_SHA}"

      # ------------------------------------------------------------
      # 6. Generate release identity
      # ------------------------------------------------------------

      - name: Generate Release Identity
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="release-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"

          echo "RELEASE_ID=${RELEASE_ID}" >> "${GITHUB_ENV}"

          echo "Release Identity:"
          echo "${RELEASE_ID}"

      # ------------------------------------------------------------
      # 7. Find Freight matching Git SHA
      # ------------------------------------------------------------

      - name: Wait for Matching Freight
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Freight for commit:"
          echo "${COMMIT_SHA}"

          ATTEMPTS=30

          until [ "${ATTEMPTS}" -eq 0 ]
          do

            FREIGHT="$(
              kubectl get freight \
                -n "${PROJECT}" \
                -o json \
                | jq -r --arg SHA "${COMMIT_SHA}" '
                    .items[]
                    | select(
                        any(.commits[]?; .id == $SHA)
                      )
                    | .metadata.name
                  ' \
                | head -n1
            )"

            if [[ -n "${FREIGHT}" ]]; then

              echo ""
              echo "Matching Freight found:"
              echo "${FREIGHT}"

              echo "FREIGHT_NAME=${FREIGHT}" >> "${GITHUB_ENV}"

              exit 0
            fi

            echo "No matching Freight yet..."
            echo "Attempts remaining: ${ATTEMPTS}"

            ATTEMPTS=$((ATTEMPTS - 1))

            sleep 10
          done

          echo ""
          echo "Timed out waiting for Freight."
          echo "Commit SHA: ${COMMIT_SHA}"

          exit 1

      # ------------------------------------------------------------
      # 8. Display release information
      # ------------------------------------------------------------

      - name: Display Release Information
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "          PRODUCTION RELEASE"
          echo "=============================================="
          echo "Release ID : ${RELEASE_ID}"
          echo "Git SHA    : ${COMMIT_SHA}"
          echo "Freight    : ${FREIGHT_NAME}"
          echo "Project    : ${PROJECT}"
          echo "Stage      : ${STAGE}"
          echo "=============================================="
          echo ""

      # ------------------------------------------------------------
      # 9. Promote Freight
      # ------------------------------------------------------------

      - name: Promote Freight
        shell: bash
        run: |
          set -euo pipefail

          echo "Promoting Freight:"
          echo "${FREIGHT_NAME}"

          echo "Target Stage:"
          echo "${STAGE}"

          kargo promote \
            --project "${PROJECT}" \
            --stage "${STAGE}" \
            --freight "${FREIGHT_NAME}" \
            --insecure-skip-tls-verify

          echo ""
          echo "Kargo promotion request submitted."

      # ------------------------------------------------------------
      # 10. Wait for Promotion
      # ------------------------------------------------------------

      - name: Wait for Promotion
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Promotion..."

          PROMOTION=""

          for i in {1..60}; do

            PROMOTION="$(
              kubectl get promotions \
                -n "${PROJECT}" \
                -o json \
                | jq -r --arg F "${FREIGHT_NAME}" '
                    .items
                    | map(
                        select(
                          .spec.freight == $F
                        )
                      )
                    | sort_by(.metadata.creationTimestamp)
                    | last
                    | .metadata.name
                  '
            )"

            if [[ -n "${PROMOTION}" && "${PROMOTION}" != "null" ]]; then
              echo ""
              echo "Promotion found:"
              echo "${PROMOTION}"
              break
            fi

            echo "Promotion not created yet..."
            sleep 2

          done

          if [[ -z "${PROMOTION}" || "${PROMOTION}" == "null" ]]; then
            echo ""
            echo "ERROR: Promotion was not created."

            kubectl get promotions \
              -n "${PROJECT}" \
              -o wide

            exit 1
          fi

          echo ""
          echo "Waiting for Promotion to succeed..."

          kubectl wait \
            "promotion/${PROMOTION}" \
            -n "${PROJECT}" \
            --for=jsonpath='{.status.phase}'=Succeeded \
            --timeout=300s

          echo ""
          echo "Promotion succeeded."

          kubectl get promotion "${PROMOTION}" \
            -n "${PROJECT}" \
            -o wide

          echo "PROMOTION_NAME=${PROMOTION}" >> "${GITHUB_ENV}"

      # ------------------------------------------------------------
      # 11. Verify Argo CD
      # ------------------------------------------------------------

      - name: Verify Argo CD
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Argo CD application to become Healthy..."

          kubectl wait \
            application/prod-app \
            -n argocd \
            --for=jsonpath='{.status.health.status}'=Healthy \
            --timeout=300s

          SYNC="$(
            kubectl get application prod-app \
              -n argocd \
              -o jsonpath='{.status.sync.status}'
          )"

          HEALTH="$(
            kubectl get application prod-app \
              -n argocd \
              -o jsonpath='{.status.health.status}'
          )"

          REVISION="$(
            kubectl get application prod-app \
              -n argocd \
              -o jsonpath='{.status.sync.revision}'
          )"

          echo ""
          echo "Argo CD Status:"
          echo "Application : prod-app"
          echo "Sync        : ${SYNC}"
          echo "Health      : ${HEALTH}"
          echo "Revision    : ${REVISION}"

          if [[ "${SYNC}" != "Synced" ]]; then
            echo ""
            echo "ERROR: Application is not Synced."
            exit 1
          fi

          if [[ "${HEALTH}" != "Healthy" ]]; then
            echo ""
            echo "ERROR: Application is not Healthy."
            exit 1
          fi

          echo ""
          echo "Argo CD application is Healthy and Synced."

      # ------------------------------------------------------------
      # 12. Release Summary
      # ------------------------------------------------------------

      - name: Release Summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "================================================"
          echo "        PRODUCTION RELEASE SUCCESSFUL"
          echo "================================================"
          echo "Release ID : ${RELEASE_ID}"
          echo "Git SHA    : ${COMMIT_SHA}"
          echo "Freight    : ${FREIGHT_NAME}"
          echo "Promotion  : ${PROMOTION_NAME}"
          echo "Stage      : ${STAGE}"
          echo "Argo App   : prod-app"
          echo "Status     : Healthy / Synced"
          echo "================================================"
          echo ""

      # ------------------------------------------------------------
      # 13. Release Failure Summary
      # ------------------------------------------------------------

      - name: Release Failure Summary
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "        PRODUCTION RELEASE FAILED"
          echo "================================================"
          echo "Release ID : ${RELEASE_ID:-unknown}"
          echo "Git SHA    : ${COMMIT_SHA:-unknown}"
          echo "Freight    : ${FREIGHT_NAME:-unknown}"
          echo "Promotion  : ${PROMOTION_NAME:-unknown}"
          echo "Stage      : ${STAGE}"
          echo "================================================"
          echo ""

          echo "Kargo Promotions:"
          kubectl get promotions \
            -n "${PROJECT}" \
            -o wide || true

          echo ""
          echo "Argo CD Application:"
          kubectl get application prod-app \
            -n argocd \
            -o wide || true
