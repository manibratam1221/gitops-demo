name: Production Release Promotion

on:
  push:
    branches:
      - main
    paths:
      - "stage/**"

jobs:
  promote:
    name: Promote Release
    runs-on: self-hosted

    concurrency:
      group: production-promotion
      cancel-in-progress: false

    environment:
      name: production

    env:
      PROJECT: gitops-demo
      STAGE: stage
      KARGO_VERSION: "1.11.2"
      ARGO_APPLICATION: prod-app

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Verify Kubernetes connectivity
      # ============================================================

      - name: Verify Kubernetes connectivity
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Kubernetes Connectivity"
          echo "=============================================="

          echo ""
          echo "kubectl client:"
          kubectl version --client

          echo ""
          echo "Kubernetes cluster:"
          kubectl cluster-info

          echo ""
          echo "Current context:"
          kubectl config current-context

          echo ""
          echo "Kargo namespace:"
          kubectl get namespace kargo

          echo ""
          echo "Kargo pods:"
          kubectl get pods -n kargo

      # ============================================================
      # 3. Install exact Kargo CLI version
      # ============================================================

      - name: Install Kargo CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Kargo CLI Installation"
          echo "=============================================="

          echo "Required Kargo version: ${KARGO_VERSION}"

          OS="$(uname -s)"
          ARCH="$(uname -m)"

          echo "Runner OS        : ${OS}"
          echo "Runner ARCH      : ${ARCH}"

          # --------------------------------------------------------
          # Detect operating system
          # --------------------------------------------------------

          case "${OS}" in
            Darwin)
              KARGO_OS="darwin"
              ;;
            Linux)
              KARGO_OS="linux"
              ;;
            *)
              echo "ERROR: Unsupported operating system: ${OS}"
              exit 1
              ;;
          esac

          # --------------------------------------------------------
          # Detect architecture
          # --------------------------------------------------------

          case "${ARCH}" in
            arm64|aarch64)
              KARGO_ARCH="arm64"
              ;;
            x86_64|amd64)
              KARGO_ARCH="amd64"
              ;;
            *)
              echo "ERROR: Unsupported architecture: ${ARCH}"
              exit 1
              ;;
          esac

          echo "Kargo OS         : ${KARGO_OS}"
          echo "Kargo ARCH       : ${KARGO_ARCH}"

          # --------------------------------------------------------
          # Install into runner-local bin
          #
          # Do NOT depend on whatever Kargo version happens to
          # already exist on the self-hosted runner.
          # --------------------------------------------------------

          KARGO_BIN_DIR="${HOME}/bin"

          mkdir -p "${KARGO_BIN_DIR}"

          echo "${KARGO_BIN_DIR}" >> "${GITHUB_PATH}"

          KARGO_URL="https://github.com/akuity/kargo/releases/download/v${KARGO_VERSION}/kargo-${KARGO_OS}-${KARGO_ARCH}"

          echo ""
          echo "Kargo download URL:"
          echo "${KARGO_URL}"

          TEMP_KARGO="$(mktemp)"

          echo ""
          echo "Downloading Kargo CLI..."

          curl \
            --fail \
            --show-error \
            --location \
            "${KARGO_URL}" \
            --output "${TEMP_KARGO}"

          chmod +x "${TEMP_KARGO}"

          mv "${TEMP_KARGO}" "${KARGO_BIN_DIR}/kargo"

          echo ""
          echo "Installed binary:"
          ls -lh "${KARGO_BIN_DIR}/kargo"

          echo ""
          echo "Kargo CLI version:"
          "${KARGO_BIN_DIR}/kargo" version

          # --------------------------------------------------------
          # Verify exact version
          #
          # Kargo returns:
          #
          # Client Version: v1.11.2
          #
          # while KARGO_VERSION is:
          #
          # 1.11.2
          #
          # Strip the leading 'v' before comparing.
          # --------------------------------------------------------

          ACTUAL_VERSION="$(
            "${KARGO_BIN_DIR}/kargo" version |
              awk '/Client Version:/ {
                gsub(/^v/, "", $3)
                print $3
              }'
          )"

          echo ""
          echo "Expected version : ${KARGO_VERSION}"
          echo "Actual version   : ${ACTUAL_VERSION}"

          if [[ "${ACTUAL_VERSION}" != "${KARGO_VERSION}" ]]; then
            echo ""
            echo "ERROR: Kargo CLI version mismatch."
            echo "Expected: ${KARGO_VERSION}"
            echo "Actual  : ${ACTUAL_VERSION}"
            exit 1
          fi

          echo ""
          echo "Kargo CLI version verified successfully."

      # ============================================================
      # 4. Authenticate with Kargo
      # ============================================================

      - name: Authenticate to Kargo
        shell: bash
        env:
          KARGO_API_ADDRESS: ${{ secrets.KARGO_SERVER }}
          KARGO_API_TOKEN: ${{ secrets.KARGO_TOKEN }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Kargo Authentication"
          echo "=============================================="

          echo ""
          echo "Kargo server:"
          echo "${KARGO_API_ADDRESS}"

          echo ""
          echo "Kargo API token:"
          echo "********"

          # --------------------------------------------------------
          # Kargo 1.11.x supports API-token authentication through
          # KARGO_API_ADDRESS + KARGO_API_TOKEN.
          #
          # This is preferable for CI because we don't need an
          # interactive login or admin password.
          # --------------------------------------------------------

          echo ""
          echo "Testing authenticated Kargo API access..."

          kargo get projects

          echo ""
          echo "Kargo stages:"

          kargo get stages \
            --project "${PROJECT}"

          echo ""
          echo "✅ Kargo authentication successful."
          echo "✅ Project access verified."

      # ============================================================
      # 5. Capture Git release identity
      # ============================================================

      - name: Capture release identity
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Release Identity"
          echo "=============================================="

          COMMIT_SHA="${GITHUB_SHA}"

          RELEASE_ID="release-$(date -u '+%Y.%m.%d')-${GITHUB_RUN_NUMBER}"

          echo "Commit SHA : ${COMMIT_SHA}"
          echo "Release ID : ${RELEASE_ID}"

          echo "COMMIT_SHA=${COMMIT_SHA}" >> "${GITHUB_ENV}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "${GITHUB_ENV}"

      # ============================================================
      # 6. Find Freight containing the Git commit
      # ============================================================

      - name: Find Freight
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Finding Freight"
          echo "=============================================="

          echo "Project    : ${PROJECT}"
          echo "Stage      : ${STAGE}"
          echo "Commit SHA : ${COMMIT_SHA}"

          echo ""
          echo "Available Freight:"

          kargo get freight \
            --project "${PROJECT}"

          echo ""
          echo "Searching for Freight containing commit..."

          FREIGHT_NAME=""

          for attempt in $(seq 1 30); do

            echo ""
            echo "Attempt ${attempt}/30"

            FREIGHT_NAME="$(
              kargo get freight \
                --project "${PROJECT}" \
                -o json |
              jq -r \
                --arg SHA "${COMMIT_SHA}" '
                  .items[]
                  | select(
                      any(
                        (.status.commits // [])[];
                        .id == $SHA
                      )
                    )
                  | .metadata.name
                ' |
              head -n 1
            )"

            if [[ -n "${FREIGHT_NAME}" ]]; then
              break
            fi

            echo "Freight not available yet."

            sleep 10

          done

          if [[ -z "${FREIGHT_NAME}" ]]; then
            echo ""
            echo "ERROR: Could not find Freight for commit:"
            echo "${COMMIT_SHA}"
            exit 1
          fi

          echo ""
          echo "Freight found:"
          echo "${FREIGHT_NAME}"

          echo "FREIGHT_NAME=${FREIGHT_NAME}" >> "${GITHUB_ENV}"

      # ============================================================
      # 7. Display release information
      # ============================================================

      - name: Display release information
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Release Information"
          echo "=============================================="

          echo "Release ID        : ${RELEASE_ID}"
          echo "Project           : ${PROJECT}"
          echo "Stage             : ${STAGE}"
          echo "Git SHA           : ${COMMIT_SHA}"
          echo "Freight           : ${FREIGHT_NAME}"
          echo "GitHub Run        : ${GITHUB_RUN_ID}"
          echo "GitHub Run Number : ${GITHUB_RUN_NUMBER}"

      # ============================================================
      # 8. Promote Freight
      # ============================================================

      - name: Promote Freight
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Kargo Promotion"
          echo "=============================================="

          echo "Project : ${PROJECT}"
          echo "Stage   : ${STAGE}"
          echo "Freight : ${FREIGHT_NAME}"

          kargo promote \
            --project "${PROJECT}" \
            --stage "${STAGE}" \
            --freight "${FREIGHT_NAME}" \
            --insecure-skip-tls-verify

          echo ""
          echo "Kargo promotion request submitted."

      # ============================================================
      # 9. Wait for Promotion
      # ============================================================

      - name: Wait for Kargo Promotion
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Waiting for Kargo Promotion"
          echo "=============================================="

          echo "Looking for promotion of Freight:"
          echo "${FREIGHT_NAME}"

          PROMOTION_NAME=""

          for attempt in $(seq 1 30); do

            echo ""
            echo "Attempt ${attempt}/30"

            PROMOTION_NAME="$(
              kargo get promotions \
                --project "${PROJECT}" \
                --stage "${STAGE}" \
                -o json |
              jq -r \
                --arg FREIGHT "${FREIGHT_NAME}" '
                  .items[]
                  | select(
                      .spec.freight == $FREIGHT
                    )
                  | .metadata.name
                ' |
              head -n 1
            )"

            if [[ -n "${PROMOTION_NAME}" ]]; then
              break
            fi

            echo "Promotion not visible yet."

            sleep 10

          done

          if [[ -z "${PROMOTION_NAME}" ]]; then
            echo ""
            echo "ERROR: Promotion was not found."

            echo ""
            echo "Current promotions:"
            kargo get promotions \
              --project "${PROJECT}" \
              --stage "${STAGE}"

            exit 1
          fi

          echo ""
          echo "Promotion found:"
          echo "${PROMOTION_NAME}"

          echo "PROMOTION_NAME=${PROMOTION_NAME}" >> "${GITHUB_ENV}"

          echo ""
          echo "Promotion details:"

          kubectl get promotion \
            "${PROMOTION_NAME}" \
            -n "${PROJECT}" \
            -o yaml

      # ============================================================
      # 10. Wait for Promotion Succeeded
      # ============================================================

      - name: Wait for Promotion to succeed
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Promotion Result"
          echo "=============================================="

          echo "Promotion: ${PROMOTION_NAME}"

          kubectl wait \
            --namespace "${PROJECT}" \
            "promotion/${PROMOTION_NAME}" \
            --for=jsonpath='{.status.phase}'=Succeeded \
            --timeout=300s

          echo ""
          echo "✅ Kargo Promotion Succeeded."

          echo ""
          echo "Final promotion status:"

          kubectl get promotion \
            "${PROMOTION_NAME}" \
            -n "${PROJECT}" \
            -o json |
          jq '{
            name: .metadata.name,
            freight: .spec.freight,
            phase: .status.phase,
            message: .status.message
          }'

      # ============================================================
      # 11. Verify Argo CD Application
      # ============================================================

      - name: Verify Argo CD application
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Argo CD Verification"
          echo "=============================================="

          echo "Application: ${ARGO_APPLICATION}"

          echo ""
          echo "Argo Application status:"

          kubectl get application \
            "${ARGO_APPLICATION}" \
            -n argocd \
            -o json |
          jq '{
            name: .metadata.name,
            sync: .status.sync.status,
            health: .status.health.status,
            revision: .status.sync.revision
          }'

          echo ""
          echo "Waiting for Argo CD application to become Healthy..."

          kubectl wait \
            --namespace argocd \
            "application/${ARGO_APPLICATION}" \
            --for=jsonpath='{.status.health.status}'=Healthy \
            --timeout=300s

          echo ""
          echo "Waiting for Argo CD application to become Synced..."

          kubectl wait \
            --namespace argocd \
            "application/${ARGO_APPLICATION}" \
            --for=jsonpath='{.status.sync.status}'=Synced \
            --timeout=300s

          echo ""
          echo "✅ Argo CD application is Healthy and Synced."

      # ============================================================
      # 12. Release Summary
      # ============================================================

      - name: Release Summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "================================================"
          echo "              RELEASE SUCCESS"
          echo "================================================"
          echo ""
          echo "Release ID        : ${RELEASE_ID}"
          echo "Project           : ${PROJECT}"
          echo "Stage             : ${STAGE}"
          echo "Git SHA           : ${COMMIT_SHA}"
          echo "Freight           : ${FREIGHT_NAME}"
          echo "Promotion         : ${PROMOTION_NAME}"
          echo "Argo Application  : ${ARGO_APPLICATION}"
          echo "GitHub Run        : ${GITHUB_RUN_ID}"
          echo ""
          echo "Kargo Promotion   : SUCCEEDED"
          echo "Argo Sync          : SYNCED"
          echo "Argo Health        : HEALTHY"
          echo ""
          echo "================================================"

      # ============================================================
      # 13. Failure Summary
      # ============================================================

      - name: Failure Summary
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "              RELEASE FAILED"
          echo "================================================"
          echo ""
          echo "Release ID        : ${RELEASE_ID:-unknown}"
          echo "Project           : ${PROJECT}"
          echo "Stage             : ${STAGE}"
          echo "Git SHA           : ${COMMIT_SHA:-unknown}"
          echo "Freight           : ${FREIGHT_NAME:-unknown}"
          echo "Promotion         : ${PROMOTION_NAME:-unknown}"
          echo "Argo Application  : ${ARGO_APPLICATION}"
          echo "GitHub Run        : ${GITHUB_RUN_ID}"
          echo ""
          echo "Check the failed workflow step above."
          echo ""
          echo "================================================"
